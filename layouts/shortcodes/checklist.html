{{ $type := .Get "type" | default "check" }}
{{ $class := "gnts-check" }}
{{ if eq $type "curve" }}{{ $class = "gnts-check-curve" }}{{ end }}
{{ if eq $type "step" }}{{ $class = "gnts-check-step" }}{{ end }}
{{ with .Get "title" }}<h4 class="gnts-check-title" style="margin-bottom:16px;">{{ . }}</h4>{{ end }}
<div class="{{ $class }}">
  {{ .Inner | markdownify }}
</div>
